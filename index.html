<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>猫猫盘珠日记</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar pixel-panel">
        <div class="brand-lockup">
          <div class="brand-title-stack">
            <img class="game-logo" src="assets/art/game-logo.png" alt="猫猫盘珠日记" />
            <h1 class="visually-hidden">猫猫盘珠日记</h1>
            <p id="saveStatus">存档待同步</p>
          </div>
          <button class="audio-button ghost-button" id="bgmButton" type="button" aria-pressed="true">
            <span class="ui-icon sparkle" aria-hidden="true"></span>
            <span id="bgmLabel">音乐待启</span>
          </button>
          <button class="guide-button ghost-button" id="guideButton" type="button">
            <span class="ui-icon sparkle" aria-hidden="true"></span>
            <span>玩法</span>
          </button>
        </div>

        <section class="resource-strip" aria-label="资源">
          <article class="resource-card">
            <span class="sprite token" aria-hidden="true"></span>
            <div>
              <strong id="zenValue">0</strong>
              <small>禅意</small>
            </div>
          </article>
          <article class="resource-card">
            <span class="sprite incense" aria-hidden="true"></span>
            <div>
              <strong id="ppsValue">0/s</strong>
              <small>猫息</small>
            </div>
          </article>
          <article class="resource-card">
            <span class="sprite jade" aria-hidden="true"></span>
            <div>
              <strong id="tapValue">+1</strong>
              <small>盘珠</small>
            </div>
          </article>
        </section>
      </header>

      <section class="play-layout">
        <section class="stage pixel-panel" aria-label="猫猫盘珠场景">
          <div class="room-scene">
            <div class="stage-sky" aria-hidden="true"></div>
            <div class="stage-rail" aria-hidden="true"></div>
            <div class="decor-layer" id="decorLayer" aria-hidden="true"></div>
            <div class="cat-layer" id="catLayer" aria-label="房间猫咪"></div>
            <aside class="cat-group-panel pixel-panel" id="catGroupPanel" hidden>
              <button class="cat-group-close ghost-button" id="catGroupCloseButton" type="button" aria-label="关闭猫群信息">×</button>
              <strong id="catGroupTitle">猫群</strong>
              <span id="catGroupCount">当前数量：1</span>
              <span id="catGroupVisible">场景显示：1</span>
              <span id="catGroupBonus">总包浆加成：×1.0</span>
              <span id="catGroupStatus">状态：开心</span>
            </aside>
          </div>

          <div class="station-zone">
            <button class="altar" id="tapTarget" type="button" aria-label="按住并旋转手串">
              <span class="station-art" aria-hidden="true"></span>
              <span class="bracelet-sprite bodhi-root altar-bracelet" id="altarBracelet" aria-hidden="true"></span>
              <span class="altar-core">
                <b id="braceletName">菩提根</b>
                <small id="braceletLevel">Lv. 1</small>
              </span>
            </button>

            <div class="ritual-bar">
              <button class="primary-action" id="mainTapButton" type="button">
                <span class="ui-icon sparkle" aria-hidden="true"></span>
                <span>拖动手串</span>
              </button>
              <button class="soft-action" id="upgradeBraceletButton" type="button">
                <span class="ui-icon arrow" aria-hidden="true"></span>
                <span id="braceletCost">升级</span>
              </button>
            </div>
          </div>

          <div class="progress-wrap" aria-label="珠串灵光">
            <div class="progress-label">
              <span>灵光</span>
              <strong id="auraLabel">0%</strong>
            </div>
            <div class="progress-frame">
              <div id="auraFill"></div>
            </div>
          </div>
        </section>

        <aside class="side-panel pixel-panel">
          <nav class="tabbar" aria-label="商店分类">
            <button class="tab-button active" data-tab="cats" type="button">猫缘</button>
            <button class="tab-button" data-tab="beads" type="button">珠阶</button>
            <button class="tab-button" data-tab="decor" type="button">装饰</button>
            <button class="tab-button" data-tab="wishes" type="button">心愿</button>
          </nav>

          <section class="panel-view active" id="catsView" aria-label="猫缘商店">
            <div class="shop-list" id="catShop"></div>
          </section>

          <section class="panel-view" id="beadsView" aria-label="珠阶商店">
            <div class="bead-board" id="beadBoard"></div>
          </section>

          <section class="panel-view" id="decorView" aria-label="装饰商店">
            <div class="decor-list" id="decorShop"></div>
          </section>

          <section class="panel-view" id="wishesView" aria-label="心愿">
            <div class="wish-list" id="wishList"></div>
          </section>
        </aside>
      </section>

      <footer class="bottom-dock pixel-panel">
        <section class="mini-stat">
          <span>累计禅意</span>
          <strong id="lifetimeValue">0</strong>
        </section>
        <section class="mini-stat">
          <span>福爪</span>
          <strong id="pawValue">0</strong>
        </section>
        <section class="mini-stat">
          <span>伙伴</span>
          <strong id="catCountValue">0</strong>
        </section>
        <button class="ghost-button" id="resetButton" type="button">清档</button>
      </footer>
    </main>

    <div class="toast-stack" id="toastStack" aria-live="polite"></div>

    <div class="guide-layer" id="guideLayer" hidden>
      <div class="guide-backdrop" aria-hidden="true"></div>
      <div class="guide-spotlight" id="guideSpotlight" aria-hidden="true"></div>
      <section class="guide-card pixel-panel" role="dialog" aria-modal="true" aria-labelledby="guideTitle" aria-describedby="guideText">
        <div class="guide-head">
          <small id="guideStepLabel">1/6</small>
          <button class="guide-close ghost-button" id="guideCloseButton" type="button" aria-label="关闭新手指南">×</button>
        </div>
        <h2 id="guideTitle">新手指南</h2>
        <p id="guideText">跟着指引盘第一串。</p>
        <div class="guide-hint" id="guideHint">点击下一步开始。</div>
        <div class="guide-dots" id="guideDots" aria-hidden="true"></div>
        <div class="guide-actions">
          <button class="ghost-button" id="guideSkipButton" type="button">跳过</button>
          <button class="soft-action" id="guidePrevButton" type="button">上一步</button>
          <button class="primary-action" id="guideNextButton" type="button">下一步</button>
        </div>
      </section>
    </div>

    <script src="game.js"></script>
  </body>
</html>
